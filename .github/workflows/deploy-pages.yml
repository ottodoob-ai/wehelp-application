name: 部署 GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取出網站檔案
        uses: actions/checkout@v6
      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上傳靜態網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: 部署網站
        id: deployment
        uses: actions/deploy-pages@v4
